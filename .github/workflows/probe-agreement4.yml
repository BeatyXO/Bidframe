name: Probe Agreement 4

on:
  push:
    branches:
      - final/submission-pass

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Read Agreement 4 from StudioNet
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from 'genlayer-js'
          import { studionet } from 'genlayer-js/chains'
          const client = createClient({ chain: studionet })
          const address = '0x3f5F81618cc86604f7094E525F46f37363CD99a7'
          const agreement = await client.readContract({ address, functionName: 'get_agreement', args: [4n] })
          console.log('AGREEMENT4='+JSON.stringify(agreement))
          const count = Number(agreement.item_count ?? 0)
          for (let i=1;i<=count;i++) {
            const item = await client.readContract({ address, functionName: 'get_item', args: [4n, BigInt(i)] })
            console.log('ITEM4_'+i+'='+JSON.stringify(item))
          }
          NODE
      - name: Verify fixed Agreement 4 hashes and final balance
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from 'genlayer-js'
          import { studionet } from 'genlayer-js/chains'
          const client=createClient({chain:studionet})
          const contract='0x3f5F81618cc86604f7094E525F46f37363CD99a7'
          const txs={
            create_agreement:'0x34a16dfd754a7c95610036d796a5bdcc0e34c5cec0dda123b1f55440f6c0aad2',
            add_item:'0xb9b66391804bb0dc3de455995973f059d29f040dbd0f34a51372d0742bd8ab9b',
            fund_agreement:'0xd6ac2104e468445982ad4fdbaa15e6a14da832c70e7f2cb1225f0d7287301fbe',
            open_checkout:'0xe6d0552086fda235400ba9de3af9509c63ff78d364d80eb2ea987fc79272981d',
            submit_checkout_evidence:'0x9d00dd3d546f0d55cb45a1d8772f6c0644bfcb12e380ab6afc2ac3aa01a6a234',
            assess_item:'0xa934622ff2808edccf5ed46fd59e70ed4d0490534dc489a0b587ecf0ddb51ce1',
            mark_ready:'0x4a99d6ac19115103a133ebdb788460d0442b71b89f33c8d62a4bc74e9cfe5d46',
            settle:'0xff14d0808973445fab66aaadd0b1477d24b4ea98b9f77aacc4a9a8e904f12235',
            landlord_transfer:'0x8eca95990809fa22d25734009fac93768d8d6b01679d2844a621faaf6c854620',
            tenant_transfer:'0x86518dd0f9f5659a7ea6f8b38246ab7f9235c81d2c95b2e0018590ccb7372ab5'
          }
          for (const [label,hash] of Object.entries(txs)) {
            const tx=await client.getTransaction({hash})
            const leader=tx.consensus_data?.leader_receipt?.find?.(r=>r.mode==='leader') ?? tx.consensus_data?.leader_receipt?.[0]
            console.log('VERIFY='+JSON.stringify({
              label,hash,
              statusName:tx.statusName ?? null,
              status:tx.status ?? null,
              result_name:tx.result_name ?? null,
              from_address:tx.from_address ?? null,
              to_address:tx.to_address ?? null,
              value:tx.value?.toString?.() ?? tx.value ?? null,
              created_at:tx.created_at ?? null,
              execution_result:leader?.execution_result ?? null,
              return_status:leader?.result?.status ?? null,
              pending_transactions:leader?.pending_transactions ?? null
            }))
          }
          const rawBalance=await client.request({method:'eth_getBalance',params:[contract,'latest']})
          console.log('CONTRACT_BALANCE_HEX='+rawBalance)
          console.log('CONTRACT_BALANCE_WEI='+BigInt(rawBalance).toString())
          NODE
