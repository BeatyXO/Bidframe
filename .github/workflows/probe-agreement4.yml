name: Probe Agreement 4

on:
  push:
    branches:
      - final/submission-pass

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Read Agreement 4 from StudioNet
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from 'genlayer-js'
          import { studionet } from 'genlayer-js/chains'
          const client = createClient({ chain: studionet })
          const address = '0x3f5F81618cc86604f7094E525F46f37363CD99a7'
          const agreement = await client.readContract({ address, functionName: 'get_agreement', args: [4n] })
          console.log('AGREEMENT4='+JSON.stringify(agreement))
          const count = Number(agreement.item_count ?? 0)
          for (let i=1;i<=count;i++) {
            const item = await client.readContract({ address, functionName: 'get_item', args: [4n, BigInt(i)] })
            console.log('ITEM4_'+i+'='+JSON.stringify(item))
          }
          NODE
      - name: Query explorer transactions for canonical contract
        run: |
          node --input-type=module <<'NODE'
          const addr='0x3f5F81618cc86604f7094E525F46f37363CD99a7'
          const urls=[
            `https://explorer-studio.genlayer.com/api/transactions?address=${addr}&limit=100&page=1`,
            `https://explorer-studio.genlayer.com/api/transactions?search=${addr}&limit=100&page=1`,
            `https://studio.genlayer.com/api/explorer/transactions?address=${addr}&limit=100&page=1`,
          ]
          for (const url of urls) {
            console.log('EXPLORER_URL='+url)
            try {
              const res=await fetch(url,{headers:{
                'accept':'application/json,text/plain,*/*',
                'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
                'referer':'https://explorer-studio.genlayer.com/txs'
              }})
              console.log('STATUS='+res.status)
              console.log((await res.text()).slice(0,60000))
            } catch (e) { console.log('EXPLORER_ERROR='+String(e)) }
          }
          NODE
