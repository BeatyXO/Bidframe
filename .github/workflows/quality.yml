name: Quality

on:
  push:
    branches:
      - main
      - fix/liveness-recovery
      - fix/live-wallet-and-submission
  pull_request:
    branches:
      - main

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install genvm-linter
      - name: GenVM lint
        env:
          GENVM_VERSION: v0.2.16
        run: genvm-lint check contracts/Bidframe.py
      - name: GenVM typecheck
        env:
          GENVM_VERSION: v0.2.16
        run: genvm-lint typecheck contracts/Bidframe.py
      - name: Direct Mode tests
        run: pytest tests/test_bidframe.py -v --tb=short
      - name: Submission source fingerprint
        run: python scripts/verify_submission.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        env:
          VITE_CONTRACT_ADDRESS: '0x9705Fa2dCc1A9b9CD545999F6a93bB4508dD997E'
          VITE_EXPLORER_BASE: 'https://explorer-studio.genlayer.com'
        run: npm run build
